# 매일 19:00 KST: 오늘 영상을 유튜브·인스타·틱톡에 게시
# 이미 성공한 플랫폼은 건너뛰므로, 실패 시 'Run workflow'로 다시 돌리면 실패한 곳만 재시도합니다.
name: shorts-top5 · 2) 게시

on:
  schedule:
    - cron: '0 10 * * *'        # UTC 10:00 = 한국 19:00
  workflow_dispatch:
    inputs:
      date:
        description: '게시할 날짜 (YYYY-MM-DD, 비우면 오늘)'
        required: false
      only:
        description: '특정 플랫폼만 (예: instagram 또는 youtube,tiktok)'
        required: false

permissions:
  contents: write

concurrency:
  group: shorts-top5-publish
  cancel-in-progress: false

defaults:
  run:
    working-directory: shorts-top5

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      UPLOAD_ENABLED: ${{ vars.UPLOAD_ENABLED || 'false' }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_AUDITED: ${{ vars.TIKTOK_AUDITED || 'false' }}
      TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 날짜
        run: echo "RUN_DATE=${{ inputs.date || '' }}" | sed "s/=$/=$(TZ=Asia/Seoul date +%F)/" >> "$GITHUB_ENV"
      - name: 오늘 영상 내려받기 (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "output/${RUN_DATE}"
          gh release download "shorts-${RUN_DATE}" -p top5.mp4 -D "output/${RUN_DATE}" --clobber
      - name: 게시
        run: node src/publish.js ${{ inputs.only && format('--only={0}', inputs.only) || '' }}
      - name: 게시 기록 커밋
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: ${RUN_DATE} 게시 기록" && git pull --rebase && git push)
      - name: 게시 대기 파일 업로드 (수동 게시용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-${{ env.RUN_DATE }}
          path: |
            shorts-top5/output/${{ env.RUN_DATE }}/pending
            shorts-top5/data/${{ env.RUN_DATE }}
          if-no-files-found: ignore
          retention-days: 14
